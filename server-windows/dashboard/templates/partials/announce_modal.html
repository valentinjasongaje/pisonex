<!--
  Shared shop-announcement modal.
  Included from Overview and PC Management.  The admin.js handler
  (setupAnnounceModal) binds on DOMContentLoaded, so the markup only has
  to exist on the page for the button to work.
-->
<div id="announcement-modal" class="modal hidden">
  <div class="modal-box">
    <h2>📢 Shop Announcement</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:12px">Broadcasts to all connected PCs. Stays visible until cleared.</p>
    <form id="announcement-form">
      <div class="form-group">
        <label>Message</label>
        <textarea id="announcement-text" name="text" rows="3" maxlength="300"
          placeholder="e.g. Shop closing in 30 minutes…"
          style="width:100%;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:14px"
          required></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-default" onclick="closeAnnouncementModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Send to All PCs</button>
      </div>
    </form>
  </div>
</div>
